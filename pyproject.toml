[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litecv-advanced"
version = "2.0.0"
description = "Lightweight advanced computer vision for edge devices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
# यहाँ नीचे क्लासिफायर्स जोड़े गए हैं
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13", # यह लाइन जोड़ी गई है
]
dependencies = [
    "Pillow>=9.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
ml     = ["tflite-runtime>=2.11"]
onnx   = ["onnxruntime>=1.14"]
camera = ["picamera2"]
all    = ["tflite-runtime>=2.11", "onnxruntime>=1.14"]

[project.urls]
Homepage   = "https://github.com/dhaval-vedra/litecv"
Repository = "https://github.com/dhaval-vedra/litecv"
