<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient — dark blue matching CV/camera theme -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050d1a"/>
      <stop offset="45%"  stop-color="#081828"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </linearGradient>
    <!-- LiteCV brand gradient: dark-gray → sky-blue -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e2e8f0"/>
      <stop offset="45%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- Aperture glow -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <!-- Green grid glow -->
    <radialGradient id="gridGlow" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#84cc16" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <!-- Underline gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip circle for aperture -->
    <clipPath id="apertureClip">
      <circle cx="200" cy="200" r="118"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid backdrop -->
  <g stroke="#38bdf8" stroke-width="0.4" stroke-opacity="0.06">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200"  y1="0" x2="200"  y2="400"/>
    <line x1="400"  y1="0" x2="400"  y2="400"/>
    <line x1="600"  y1="0" x2="600"  y2="400"/>
    <line x1="800"  y1="0" x2="800"  y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  CAMERA APERTURE ICON  (left side, cx=200 cy=200)  -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Outer glow halo -->
  <circle cx="200" cy="200" r="145" fill="url(#apertureGlow)">
    <animate attributeName="r" values="145;160;145" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="125" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>

  <!-- Aperture blades (6 blades like a real lens) — clipped to circle -->
  <g clip-path="url(#apertureClip)" filter="url(#glow)">
    <!-- Blade 1 — top-right -->
    <polygon points="200,82 318,200 200,200" fill="#38bdf8" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 200; 8 200 200; 0 200 200" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <!-- Blade 2 — right -->
    <polygon points="318,200 200,318 200,200" fill="#0ea5e9" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 200; 8 200 200; 0 200 200" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <!-- Blade 3 — bottom-right -->
    <polygon points="200,318 82,200 200,200" fill="#38bdf8" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 200; 8 200 200; 0 200 200" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <!-- Blade 4 — left -->
    <polygon points="82,200 200,82 200,200" fill="#0ea5e9" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate"
        values="0 200 200; 8 200 200; 0 200 200" dur="5s" repeatCount="indefinite"/>
    </polygon>
    <!-- Inner dark gap to create real aperture look -->
    <circle cx="200" cy="200" r="72" fill="#081828"/>

    <!-- Green pixel/convolution grid inside aperture center -->
    <g transform="translate(200,200)" fill="none" stroke="#84cc16" stroke-width="1.8" opacity="0.9">
      <!-- Vertical lines -->
      <line x1="-44" y1="-44" x2="-44" y2="44"/>
      <line x1="-22" y1="-44" x2="-22" y2="44"/>
      <line x1="0"   y1="-44" x2="0"   y2="44"/>
      <line x1="22"  y1="-44" x2="22"  y2="44"/>
      <line x1="44"  y1="-44" x2="44"  y2="44"/>
      <!-- Horizontal lines -->
      <line x1="-44" y1="-44" x2="44" y2="-44"/>
      <line x1="-44" y1="-22" x2="44" y2="-22"/>
      <line x1="-44" y1="0"   x2="44" y2="0"/>
      <line x1="-44" y1="22"  x2="44" y2="22"/>
      <line x1="-44" y1="44"  x2="44" y2="44"/>
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.5s" repeatCount="indefinite"/>
    </g>

    <!-- Grid glow -->
    <circle cx="200" cy="200" r="50" fill="url(#gridGlow)"/>
  </g>

  <!-- Lens flare sparkle (top-right of aperture) -->
  <g transform="translate(283, 120)" filter="url(#glow)">
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0; 45 0 0; 0 0 0" dur="4s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Small scan ring animation -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate"
      from="0 200 200" to="360 200 200" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  TEXT  (right side)                                -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- "Lite" in near-white -->
  <text x="390" y="212" font-family="Arial Black, sans-serif" font-size="92"
        fill="#e2e8f0" font-weight="900" filter="url(#softglow)" letter-spacing="-2">Lite</text>

  <!-- "CV" in sky-blue -->
  <text x="623" y="212" font-family="Arial Black, sans-serif" font-size="92"
        fill="#38bdf8" font-weight="900" filter="url(#softglow)" letter-spacing="-2">CV</text>

  <!-- Animated underline -->
  <rect x="390" y="225" width="390" height="4" rx="2" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;390;0"   dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x"     values="585;390;585" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="388" y="270" font-family="Arial, sans-serif" font-size="20"
        fill="#94a3b8" letter-spacing="2.5">Lightweight Computer Vision Library</text>

  <!-- Three feature pills -->
  <g transform="translate(390,302)">
    <rect x="0"   y="0" width="175" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12"
          stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7"/>
    <text x="88"  y="22" font-family="Arial, sans-serif" font-size="12.5" fill="#38bdf8"
          text-anchor="middle" font-weight="600">📷 Real-Time Camera</text>

    <rect x="185" y="0" width="165" height="34" rx="17" fill="#84cc16" fill-opacity="0.12"
          stroke="#84cc16" stroke-width="1" stroke-opacity="0.7"/>
    <text x="268" y="22" font-family="Arial, sans-serif" font-size="12.5" fill="#84cc16"
          text-anchor="middle" font-weight="600">🎨 10+ Filters</text>

    <rect x="360" y="0" width="178" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.12"
          stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.7"/>
    <text x="449" y="22" font-family="Arial, sans-serif" font-size="12.5" fill="#0ea5e9"
          text-anchor="middle" font-weight="600">🍓 Pi Optimized</text>
  </g>

  <!-- Floating scan-line particles (right side) -->
  <g fill="#38bdf8" opacity="0.5" filter="url(#glow)">
    <circle cx="870" cy="60"  r="2.5">
      <animate attributeName="cy" values="60;40;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="320" r="2">
      <animate attributeName="cy" values="320;340;320" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="370" r="1.8">
      <animate attributeName="cy" values="370;350;370" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="90"  r="2">
      <animate attributeName="cy" values="90;70;90" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.45">
    <polyline points="10,10 10,42 42,42"/>
    <polyline points="1190,10 1190,42 1158,42"/>
    <polyline points="10,390 10,358 42,358"/>
    <polyline points="1190,390 1190,358 1158,358"/>
  </g>
</svg>
